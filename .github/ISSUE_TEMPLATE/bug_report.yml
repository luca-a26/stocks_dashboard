name: Bug Report
description: Report a dashboard, data, or workflow bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, or commands.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and dependency notes.
