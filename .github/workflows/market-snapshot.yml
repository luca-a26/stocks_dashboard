name: Refresh market snapshot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ENABLE_MARKET_REFRESH_ACTION: "true"
      MARKET_SNAPSHOT_PATH: data/company_market_snapshot.csv
      MARKET_SNAPSHOT_MAX_AGE_HOURS: "6"
      MARKET_SNAPSHOT_REQUIRED_COVERAGE: "0.95"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh snapshot
        run: |
          python -m scripts.refresh_company_market_snapshot \
            --input data/company_market_snapshot.csv \
            --output-csv data/company_market_snapshot.csv \
            --output-json data/company_market_snapshot.json \
            --audit-output storage/audit/company_market_snapshot_audit.json \
            --force-refresh

      - name: Upload coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: company-market-snapshot-audit
          path: storage/audit/company_market_snapshot_audit.json

      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company_market_snapshot.csv data/company_market_snapshot.json
          if git diff --cached --quiet; then
            echo "No market snapshot changes"
          else
            git commit -m "chore(data): refresh company market snapshot"
            git push
          fi
