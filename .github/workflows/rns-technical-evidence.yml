name: RNS Technical Evidence

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-rns-technical-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh RNS technical evidence
        run: |
          python -m scripts.refresh_rns_technical_evidence \
            --input data/company_market_snapshot.csv \
            --output-csv data/rns_technical_evidence.csv \
            --output-json storage/audit/rns_technical_evidence_audit.json

      - name: Upload RNS audit
        uses: actions/upload-artifact@v4
        with:
          name: rns-technical-evidence-audit
          path: storage/audit/rns_technical_evidence_audit.json
          if-no-files-found: warn

      - name: Commit updated RNS evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rns_technical_evidence.csv
          if git diff --cached --quiet; then
            echo "No RNS technical evidence changes"
          else
            git commit -m "chore(data): refresh RNS technical evidence"
            git push
          fi
